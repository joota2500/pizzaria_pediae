<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personalizar Pedido</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<!-- =========================
HEADER
========================= -->
<header class="header-confirmacao">
  <div class="header-left">
    <button onclick="voltar()" class="btn-voltar">←</button>
  </div>
  <div class="header-title">
    <h2>Personalizar pedido</h2>
  </div>
</header>


<!-- =========================
CONTEÚDO
========================= -->
<main>
<section class="container-pedido">


<!-- =========================
PIZZA ESCOLHIDA
========================= -->
<div class="card-padrao">
  <h3>Seu pedido</h3>
  <div id="seletorPizzas" class="seletor-pizzas"></div>

  <div id="resumoPizza">
    <!-- JS injeta aqui -->
  </div>
</div>


<!-- =========================
ADICIONAIS
========================= -->
<div class="card-padrao">

  <h3>Adicionais</h3>
  <p class="subtitulo">Escolha até 3 adicionais</p>

  <button class="btn-expandir" onclick="toggleAdicionais()">
    Ver adicionais ▼
  </button>

  <div id="listaAdicionais" class="lista-adicionais">
    <!-- JS injeta -->
  </div>

</div>


<!-- =========================
RESUMO
========================= -->
<div class="card-padrao">
  <h3>Resumo</h3>

  <div id="resumoAdicional">
    Nenhum adicional selecionado
  </div>
</div>


<!-- =========================
BOTÃO
========================= -->
<button class="btn-principal" onclick="confirmarAdicionais()">
  Continuar ➜
</button>


</section>
</main>


<!-- =========================
FOOTER
========================= -->
<footer class="footer">
  <p>🍕 Seu pedido será preparado com carinho</p>
</footer>


<!-- =========================
SCRIPTS
========================= -->
<script src="../js/modules/adicionais.js"></script>
<script src="../js/core/carrinho.js"></script>
<script src="../js/modules/bebidas.js"></script>
<script src="../js/modules/combos.js"></script>
<script src="../js/pages/home.js"></script>
<script src="../js/modules/animacoes.js"></script>
<script src="../js/modules/cardapio.js"></script>

<script>
function voltar(){

const veioDoCarrinho = document.referrer.includes("index")

if(veioDoCarrinho){
  window.history.back()
}else{
  window.location.href = "../index.html"
}

}
</script>
<div class="footer-total">
  <div>
    <span>Total</span>
    <strong id="totalGeral">R$ 0,00</strong>
  </div>

  <button class="btn-finalizar" onclick="confirmarAdicionais()">
    Continuar
  </button>
</div>

</body>
</html>
