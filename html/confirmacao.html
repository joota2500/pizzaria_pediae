<!DOCTYPE html>
<html lang="pt-BR">

<head> 

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Confirmar Pedido</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="header-confirmacao">
<button onclick="voltar()">←</button>
<h2>Confirmar Pedido</h2>
</header>

<main class="container-confirmacao">

<!-- ================================
CARD PRINCIPAL (1º ITEM)
================================ -->
<div class="card-confirmacao">

<img id="imgPizza">

<div class="info">
<h3 id="nomePizza"></h3>
<p id="ingredientes"></p>
<span id="tamanho"></span>
</div>

</div>


<!-- ================================
🔥 LISTA COMPLETA DO CARRINHO
================================ -->
<div class="card-adicionais">

<h4>🧾 Itens do Pedido</h4>

<div id="listaConfirmacao"></div>

<p id="totalConfirmacao" style="margin-top:10px;font-weight:600;"></p>

</div>


<!-- ================================
ADICIONAIS (ITEM PRINCIPAL)
================================ -->
<div class="card-adicionais">
<h4>Adicionais</h4>
<ul id="listaAdicionais"></ul>
</div>


<!-- ================================
OBSERVAÇÃO
================================ -->
<div class="observacao-box">

<label>Observação</label>

<textarea id="observacao"
placeholder="Ex: sem cebola, bem passada..."></textarea>

</div>


<!-- ================================
TOTAL FINAL
================================ -->
<div class="total-box">
<span>Total</span>
<h2 id="totalPedido"></h2>
</div>

</main>


<!-- ================================
BOTÕES FIXOS
================================ -->
<div class="acoes-fixas"> 

<div class="linha-acoes">
<button class="btn-cancelar" onclick="cancelarPedido()">Cancelar</button>
<button class="btn-editar" onclick="abrirModalEditar()">Editar</button>
<button class="btn-add" onclick="adicionarMais()">+ Adicionar</button>
</div>

<button class="btn-confirmar" onclick="confirmar()">
Confirmar pedido
</button>

</div>


<a href="#" class="whatsapp-flutuante">💬</a>


<!-- JS -->
<script src="../js/pages/confirmacao.js"></script>
<script src="../js/core/pedidos.js"></script>
<script src="../js/core/carrinho.js"></script>

<!-- ================================
🛠 MODAL EDITAR PEDIDOS (REUTILIZÁVEL)
================================ -->
<div id="modalEditar" class="modal-editar">

  <div class="modal-box">

    <!-- TÍTULO -->
    <h3>🧾 Seus pedidos</h3>

    <!-- LISTA DINÂMICA -->
    <div id="listaEditar"></div>

    <!-- TOTAL -->
    <p id="totalEditar" style="margin-top:10px;font-weight:600;"></p>

    <!-- AÇÃO -->
    <button class="btn-confirmar" onclick="fecharModalEditar()">
      Salvar alterações
    </button>

  </div>

</div> 
<div id="toastAtualizando" class="toast-atualizando">

  <div class="toast-box">
   <span id="textoToast">🔄 Atualizando seu pedido...</span>
    <div class="barra"></div>
  </div>

</div>

</body>
</html>
