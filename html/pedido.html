<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finalizar Pedido</title>

<meta name="theme-color" content="#c62828">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header-confirmacao">
  <div class="header-left">
    <button onclick="voltar()" class="btn-voltar">←</button>
  </div>
  <div class="header-title">
    <h2>Finalizar Pedido</h2>
  </div>
</header>

<a href="https://wa.me/5585989214864" class="whatsapp-flutuante" target="_blank">💬</a>

<main>
<section class="container-pedido">

<!-- ENTREGA -->
<div class="card-padrao">
<h3>Como deseja receber?</h3>

<div class="tipo-entrega">
<label>
<input type="radio" name="tipoEntrega" value="casa">
<span>🚚 Entregar</span>
</label>

<label>
<input type="radio" name="tipoEntrega" value="retirada">
<span>🏪 Retirar</span>
</label>
</div>
</div>

<!-- FORM -->
<div id="formEntrega" class="card-padrao hidden">

<h3>Endereço de entrega</h3>

<input id="nome" class="input-padrao" placeholder="👤 Nome completo">
<input id="telefone" class="input-padrao" placeholder="📞 Telefone">
<input id="endereco" class="input-padrao" placeholder="📍 Rua e número">

<select id="bairro" class="input-padrao">
<option value="">Selecione o bairro</option>
</select>

<input id="complemento" class="input-padrao" placeholder="🏢 Complemento">
<input id="referencia" class="input-padrao" placeholder="📌 Referência">
<input id="recebedor" class="input-padrao" placeholder="👤 Recebedor">

</div>

<!-- RETIRADA -->
<div id="retiradaBox" class="card-padrao hidden retirada-box">
<h3>Retirada no local</h3>
<p>📍 Rua da Pizza, 123 - Centro</p>
<a href="https://maps.google.com/?q=Rua da Pizza,123" target="_blank">
Ver no mapa
</a>
</div>

<!-- PAGAMENTO -->
<div class="card-padrao">
<h3>Pagamento</h3>

<select id="pagamento" class="input-padrao">
<option value="">Forma de pagamento</option>
<option value="dinheiro">💵 Dinheiro</option>
<option value="pix">📲 Pix</option>
<option value="cartao">💳 Cartão</option>
</select>

<div id="areaTroco" class="hidden">
<input id="troco" class="input-padrao" placeholder="Troco para quanto?">
</div>

</div>

<!-- OBS -->
<div class="card-padrao">
<h3>Observação</h3>
<textarea id="obsFinal" class="input-padrao" placeholder="Ex: sem cebola"></textarea>
</div>

<!-- BOTÃO -->
<button class="btn-principal" onclick="abrirModalPedido()">
Ver Pedido 🧾
</button>

</section>
</main>

<!-- MODAL PEDIDO -->
<div id="modalPedido" class="modal-pedido">

  <div class="modal-conteudo">

    <div class="modal-header">
      <h3>Seu pedido</h3>
     <button onclick="fecharModalPedido()" type="button"> ✕ </button>
    </div>

    <div class="resumo-grid">

      <div class="resumo-itens">
        <div id="pizzaResumo"></div>
        <div id="bebidaResumo"></div>
      </div>

      <div class="resumo-totais">
        <p id="subtotalResumo"></p>
        <p id="cupomResumo"></p>
        <p id="taxaEntrega">Entrega: R$ 0,00</p>
        <h2 id="totalResumo"></h2>
      </div>

    </div>

    <div class="footer-modal">
  <button class="btn-principal" onclick="enviarPedido()">
    Finalizar Pedido 🚀
  </button>
</div>

  </div>

</div>

<script src="../js/core/config.js"></script>
<script src="../js/core/entrega.js"></script>
<script src="../js/core/cupom.js"></script>
<script src="../js/core/horario.js"></script>
<script src="../js/pages/pedidoPage.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

window.abrirModalPedido = function(){

  const modal = document.getElementById("modalPedido")

  if(modal){
    modal.classList.add("ativo")
    document.body.style.overflow = "hidden"
  }

}

window.fecharModalPedido = function(){

  const modal = document.getElementById("modalPedido")

  if(modal){
    modal.classList.remove("ativo")
    document.body.style.overflow = "auto"
  }

}
const modal = document.getElementById("modalPedido")

if(modal){
  modal.addEventListener("click", (e)=>{
    if(e.target.id === "modalPedido"){
      fecharModalPedido()
    }
  })
}
</script>

</body>
</html>
