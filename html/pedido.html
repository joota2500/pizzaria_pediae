<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finalizar Pedido</title>

<meta name="theme-color" content="#c62828">

<!-- BOOTSTRAP -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- 🔥 MESMOS CSS DAS OUTRAS TELAS -->
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/base/layout.css">
<link rel="stylesheet" href="../css/components/cards.css">
<link rel="stylesheet" href="../css/components/botoes.css">
<link rel="stylesheet" href="../css/components/footer.css">
<link rel="stylesheet" href="../css/components/whatsapp.css">

<!-- CSS DA PÁGINA -->
<link rel="stylesheet" href="../css/pages/pedido.css">

</head>

<body>

<!-- ================= HEADER (IGUAL CONFIRMAÇÃO) ================= -->
<header class="header-confirmacao">

<button onclick="voltar()" class="btn-voltar">
←
</button>

<h2>Finalizar Pedido</h2>

</header>

<!-- STATUS -->
<div class="status-pizzaria" id="statusPizzaria"></div>

<!-- WHATS -->
<a href="https://wa.me/5585989214864" class="whatsapp-flutuante" target="_blank">
💬
</a>

<!-- ================= MAIN ================= -->
<main>

<section class="container-pedido">

<h2 class="titulo-secao">........................</h2>

<!-- 🔥 ENTREGA -->
<div class="card-padrao">

<h3>Como deseja receber?</h3>

<div class="tipo-entrega">

<label>
<input type="radio" name="tipoEntrega" value="casa">
<span>🚚 Entregar</span>
</label>

<label>
<input type="radio" name="tipoEntrega" value="retirada">
<span>🏪 Retirar</span>
</label>

</div>

</div>

<!-- 🔥 FORM ENTREGA -->
<div id="formEntrega" class="card-padrao hidden">

<input type="text" id="nome" placeholder="Nome completo" class="input-padrao">
<input type="tel" id="telefone" placeholder="Telefone" class="input-padrao">
<input type="text" id="endereco" placeholder="Rua e número" class="input-padrao">

<select id="bairro" class="input-padrao">
<option value="">Selecione seu bairro</option>
</select>

</div>

<!-- 🔥 RETIRADA -->
<div id="retiradaBox" class="card-padrao hidden retirada-box">

<p>📍 Retirar na pizzaria</p>

<a href="https://maps.google.com/?q=Rua da Pizza,123" target="_blank">
Ver localização
</a>

</div>

<!-- 🔥 PAGAMENTO -->
<div class="card-padrao">

<select id="pagamento" class="input-padrao">
<option value="">Forma de pagamento</option>
<option value="dinheiro">Dinheiro</option>
<option value="pix">Pix</option>
<option value="cartao">Cartão</option>
</select>

<div id="areaTroco" class="hidden">
<input type="text" id="troco" placeholder="Troco para quanto?" class="input-padrao">
</div>

</div>

<!-- 🔥 OBS -->
<div class="card-padrao">

<textarea id="obsFinal" placeholder="Observação (ex: sem cebola)" class="input-padrao"></textarea>

</div>

<!-- 🔥 RESUMO -->
<div class="card-padrao resumo-pedido">

<h3>Seu pedido</h3>

<div id="pizzaResumo"></div>
<div id="bebidaResumo"></div>

<p id="subtotalResumo"></p>
<p id="cupomResumo"></p>
<p id="taxaEntrega"></p>

<h2 id="totalResumo"></h2>

</div>

<!-- 🔥 BOTÃO PADRÃO -->
<button class="btn-principal" onclick="confirmarEnvio()">
Finalizar Pedido 🚀
</button>

</section>

</main>

<!-- ================= FOOTER ================= -->
<footer class="footer">
<p>📍 Fortaleza - CE</p>
<p>©️ 2026 PeçaPizzaOnline</p>
</footer>

<!-- ================= JS ================= -->

<script src="../js/config.js"></script>
<script src="../js/entrega.js"></script>
<script src="../js/cupom.js"></script>
<script src="../js/horario.js"></script>
<script src="../js/pedidoPage.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
