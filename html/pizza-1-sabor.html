<!DOCTYPE html>
<html lang="pt-BR"> 

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escolher Pizza</title>

<meta name="theme-color" content="#c62828">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/base/layout.css">
<link rel="stylesheet" href="../css/components/cards.css">
<link rel="stylesheet" href="../css/components/botoes.css">
<link rel="stylesheet" href="../css/components/menu-bottom.css">
<link rel="stylesheet" href="../css/components/footer.css">
<link rel="stylesheet" href="../css/components/carrossel.css">
<link rel="stylesheet" href="../css/components/whatsapp.css">
<link rel="stylesheet" href="../css/pages/pizza.css">

</head>

<body>

<header class="container-header header-pizza">

<button onclick="voltarIndex()" class="btn-voltar">←</button>

<img src="../img/logo/imgLogoPizzaria.png" class="logo">

</header>

<div class="status-pizzaria" id="statusPizzaria"></div>

<a href="https://wa.me/5585989214864" class="whatsapp-flutuante" target="_blank">💬</a>

<main>

<section>

<h2>Escolha sua pizza 🍕</h2>
<!-- 🔍 BUSCADOR -->
<div class="busca-container">
<input 
id="buscaPizza"
type="text" 
placeholder="Buscar pizza ou ingrediente...">
</div>

<div class="grid-pizzas" id="lista-pizzas"></div>

<button id="mostrarCardapio" class="botao-expandir">
Ver cardápio completo
</button>

</section>

</main>

<!-- 🔥 RESUMO FIXO -->
<div class="resumo-pedido">

<div id="resumoTexto">
Nenhuma pizza selecionada
</div>

<div class="resumo-botoes">
<button onclick="cancelar()">Cancelar</button>
<button id="btnProximo" onclick="proximo()" disabled>Próximo</button>
</div>

</div>

<footer class="footer">
<p>📍 Fortaleza - CE</p>
<p>©️ 2026 PeçaPizzaOnline</p>
</footer>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 🔥 ORDEM IMPORTANTE -->
<script src="../js/modules/cardapio.js"></script>
<script src="../js/pages/pizza1.js"></script>
<script src="../js/modules/adicionais.js"></script>

<div id="modalAdicionais" class="modal-adicionais">

<div class="modal-content">

<!-- TOPO -->
<div class="modal-header">
<button onclick="fecharModal()">←</button>
<h3>Personalize sua pizza</h3>
</div>

<p class="descricao">
Deseja adicionar algo à sua pizza? <br>
Escolha até <strong>3 adicionais</strong>.
</p>

<!-- BOTÃO ABRIR LISTA -->
<button class="btn-expandir" onclick="toggleAdicionais()">
Ver adicionais
</button>

<!-- LISTA -->
<div id="listaAdicionais" class="lista-adicionais">

</div>

<!-- RESUMO -->
<div class="resumo-adicional" id="resumoAdicional">
Nenhum adicional selecionado
</div>

<!-- AÇÕES -->
<div class="acoes-modal">
<button onclick="pularAdicionais()">Não adicionar</button>
<button onclick="confirmarAdicionais()">Próximo</button>
</div>

</div>
</div>

</body> 
</html>
