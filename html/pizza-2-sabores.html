<!DOCTYPE html>
<html lang="pt-BR"> 

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pizza 2 Sabores</title>

<meta name="theme-color" content="#c62828">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/base/layout.css">
<link rel="stylesheet" href="../css/components/cards.css">
<link rel="stylesheet" href="../css/components/botoes.css">
<link rel="stylesheet" href="../css/components/footer.css">
<link rel="stylesheet" href="../css/components/whatsapp.css">
<link rel="stylesheet" href="../css/pages/pizza.css">
<link rel="stylesheet" href="../css/pages/pizza-2.css">

</head>

<body>

<header class="container-header header-pizza">
<button onclick="voltarIndex()" class="btn-voltar">←</button>
<h2>Pizza 2 Sabores 🍕</h2>
</header>

<main>

<section>
    <h2>Escolha sua pizza 🍕</h2>
<!-- 🔍 BUSCADOR -->
 <h3>Escolha o 1º sabor</h3>
    <div class="busca-container">
    <input 
    id="buscaPizza1"
    type="text" 
    placeholder="Buscar sabor ou pizza 1...">
    </div>
<div class="grid-pizzas" id="lista-pizzas-1"></div>

<!-- ver lista completa-->>
<button 
class="botao-expandir"
onclick="toggleCardapio('lista-pizzas-1',1)">
Ver cardápio completo
</button>


<h3>Escolha o 2º sabor</h3>
 <div class="busca-container">
    <input 
    id="buscaPizza2"
    type="text" 
    placeholder="Buscar sabor ou pizza 2...">
    </div>
<div class="grid-pizzas" id="lista-pizzas-2"></div>

<button 
class="botao-expandir"
onclick="toggleCardapio('lista-pizzas-2',2)">
Ver cardápio completo
</button>

</section>

</main>

<!-- RESUMO -->
<div class="resumo-pedido">

<div id="resumoTexto">
Selecione 2 sabores
</div>

<div class="resumo-botoes">
<button onclick="cancelar()">Cancelar</button>
<button id="btnProximo" onclick="proximo()" disabled>Próximo</button>
</div>

</div>

<script src="../js/modules/cardapio.js"></script>
<script src="../js/pages/pizza2.js"></script>

</body>
</html>
